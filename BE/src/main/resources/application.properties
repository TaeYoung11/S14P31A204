spring.application.name=back

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# SQL init (PostgreSQL)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.platform=postgresql
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=${JWT_SECRET}


# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.database=${SPRING_REDIS_DATABASE:0}
spring.data.redis.timeout=${SPRING_REDIS_TIMEOUT:3s}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# RabbitMQ Listener Retry
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=5000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# AWS S3
app.aws.region=${AWS_REGION}
app.aws.s3.endpoint-url=${AWS_S3_ENDPOINT_URL:}
app.aws.s3.bucket=${AWS_S3_BUCKET}
app.aws.s3.presign-expiration-seconds=${AWS_S3_PRESIGN_EXPIRATION_SECONDS}
app.aws.s3.delete.queue-key=${AWS_S3_DELETE_QUEUE_KEY:workspace:floor-plan:s3:delete:queue}
app.aws.s3.delete.batch-size=${AWS_S3_DELETE_BATCH_SIZE:500}
app.aws.s3.delete.schedule-cron=${AWS_S3_DELETE_SCHEDULE_CRON:0 0 4 * * *}
app.aws.s3.delete.schedule-zone=${AWS_S3_DELETE_SCHEDULE_ZONE:Asia/Seoul}
