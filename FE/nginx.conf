server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Module worker(.mjs) / wasm 정적 파일 MIME 보정
    types {
        application/javascript js mjs;
        application/wasm wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
