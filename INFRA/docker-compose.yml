services:
  nginx:
    image: nginx:1.27-alpine
    container_name: batang-nginx
    # restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fe
      - be
    networks:
      - batang-network

  fe:
    # restart: unless-stopped
    build:
      context: ../FE
      dockerfile: Dockerfile
      args:
        - VITE_KAKAO_MAP_API_KEY=${VITE_KAKAO_MAP_API_KEY}
        - VITE_API_URL=${VITE_API_URL}
    container_name: batang-fe
    expose:
      - "80"
    networks:
      - batang-network

  be:
    # restart: unless-stopped
    build:
      context: ../BE
      dockerfile: Dockerfile
    container_name: batang-be
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      VWORLD_API_KEY: ${VWORLD_API_KEY}
      VWORLD_REFERER: ${VWORLD_REFERER}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - batang-network

  worker:
    profiles:
      - ai
    # restart: unless-stopped
    build:
      context: ../AI
      dockerfile: Dockerfile
    container_name: batang-worker
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
    depends_on:
      - rabbitmq
      - minio
    networks:
      - batang-network

  postgres:
    image: postgres:16-alpine
    container_name: batang-postgres
    # restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - batang-network

  redis:
    image: redis:7-alpine
    container_name: batang-redis
    # restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - batang-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: batang-rabbitmq
    # restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - batang-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: batang-minio
    # restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - batang-network

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: batang-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET} || true;
      exit 0;
      "
    networks:
      - batang-network

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:

networks:
  batang-network:
    driver: bridge
