[project]
name = "ai-authoring"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ai-common",
    "ai-domain",
    "ai-planning-2d",
]

[project.scripts]
authoring-worker = "ai_authoring.worker_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_authoring"]
