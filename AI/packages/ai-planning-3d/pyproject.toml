[project]
name = "ai-planning-3d"
version = "0.1.0"
description = "AI 3D Planning module for natural language interpretation"
authors = [{ name = "S14P31A204" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "instructor>=1.3.0",
    "openai>=1.12.0",
    "pydantic>=2.0.0",
    "ai-authoring",
    "ai-common",
    "ai-domain",
]

[project.scripts]
planning-3d-worker = "ai_planning_3d.worker_app:main"

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_planning_3d"]
