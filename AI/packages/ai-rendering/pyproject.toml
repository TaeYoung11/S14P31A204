[project]
name = "ai-rendering"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ai-common",
    "ai-domain",
    "torch",
    "diffusers>=0.25",
    "transformers",
    "accelerate",
    "pillow",
    "pyyaml",
    "opencv-python",
    "numpy",
    "open3d>=0.19.0",
    "ifcopenshell>=0.8.5",
]

[project.scripts]
rendering-worker = "ai_rendering.worker_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_rendering"]
