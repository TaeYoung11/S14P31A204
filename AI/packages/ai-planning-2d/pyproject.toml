[project]
name = "ai-planning-2d"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ai-domain",
    "instructor>=1.15.1",
    "openai>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_planning_2d"]
