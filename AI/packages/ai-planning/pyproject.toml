[project]
name = "ai-planning"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ai-common",
    "ai-domain",
    "ifcopenshell>=0.8.5",
    "instructor>=0.4.0",
    "lark>=1.3.1",
    "openai>=1.109.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_planning"]
