[project]
name = "ai-layout-import"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ai-domain",
    "ifcopenshell>=0.8.5",
]

[project.scripts]
layout-import-json-to-ifc = "ai_layout_import.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_layout_import"]
