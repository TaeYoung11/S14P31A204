[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img2img"
version = "0.1.0"
description = "BATANG img2img: Stable Diffusion img2img module for 3D viewer captures"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "diffusers>=0.25",
    "transformers",
    "accelerate",
    "pyyaml",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["img2img*"]
