base_preset: scandinavian

prompt: >-
  RAW photo, ultra-minimalist scandinavian house exterior,
  pure white smooth rendered wall, floor-to-ceiling windows, flat roof,
  no ornament, brutal geometric simplicity, 8k uhd, DSLR, sharp focus,
  architectural photography, overcast soft diffused daylight

negative_prompt: >-
  (worst quality, low quality:1.4), (deformed, distorted:1.3),
  (cgi, 3d, render, blender:1.4), cartoon, anime, illustration,
  text, watermark, signature,
  interior, indoor, furniture, wood cladding, warm tones, ornate details, brick
